            { id: '7B-PI-33', name: 'Avikah Rosafitri', className: 'VII B PUTRI', time: '11.00 - 12.20 WIB' }
        ];

        // --- APP KOMPONEN UTAMA ---
        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [students, setStudents] = useState(studentData);
            const [isAdmin, setIsAdmin] = useState(false);
            
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState('');

            const handleAdminAccessClick = () => {
                if (isAdmin) {
                setIsAdmin(false); 
                } else {
                setShowLoginModal(true); 
                setPasswordInput('');
                setLoginError('');
                }
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === "malika123") {
                setIsAdmin(true);
                setShowLoginModal(false);
                } else {
                setLoginError('Password salah!');
                }
            };

            const toggleHoldStatus = (id) => {
                setStudents(prev => prev.map(s => s.id === id ? { ...s, isHold: !s.isHold } : s));
            };

            const trimmedSearch = searchTerm.trim().toLowerCase();
            const isSearchTooShort = trimmedSearch.length > 0 && trimmedSearch.length < 3;

            const filteredStudents = useMemo(() => {
                if (!trimmedSearch || isSearchTooShort) return [];
                const searchWords = trimmedSearch.split(/\s+/);
                return students.filter(student => {
                const fullName = student.name.toLowerCase();
                return searchWords.every(word => fullName.includes(word));
                });
            }, [trimmedSearch, students, isSearchTooShort]);

            return (
                <div className="min-h-screen flex flex-col font-sans">
                
                {/* Header Banner */}
                <header className="bg-gradient-to-r from-blue-600 to-sky-400 shadow-md">
                    <div className="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
                    <div className="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0 text-white">
                        
                        <div className="flex items-center space-x-4">
                        <div className="bg-white p-2 rounded-full shadow-lg">
                            <img 
                            src="https://iili.io/FsLlXA7.png" 
                            alt="Logo Malika Boarding School" 
                            className="h-16 w-16 md:h-20 md:w-20 object-contain rounded-full"
                            />
                        </div>
                        <div>
                            <h1 className="text-2xl md:text-3xl font-bold tracking-tight">
                            Jadwal Sesi Pengambilan Rapor
                            </h1>
                            <p className="text-blue-100 flex items-center mt-1 text-sm md:text-base">
                            <SchoolIcon className="w-4 h-4 mr-1" />
                            SMP Malika Boarding School
                            </p>
                        </div>
                        </div>

                        <div className="bg-blue-800/30 backdrop-blur-sm rounded-lg p-3 text-sm border border-blue-400/50 shadow-inner w-full md:w-auto">
                        <div className="flex items-center space-x-2 text-blue-50 mb-1">
                            <CalendarIcon className="w-4 h-4 text-blue-200" />
                            <span className="font-semibold">Selasa, 16 Juni 2026</span>
                        </div>
                        <div className="flex items-center justify-between space-x-4 text-blue-50">
                            <div className="flex items-center space-x-2">
                            <MapPinIcon className="w-4 h-4 text-blue-200" />
                            <span> Gedung SMP Malika</span>
                            </div>
                            {isAdmin && (
                            <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-amber-500 text-white shadow-sm">
                                <ShieldCheckIcon className="w-3 h-3 mr-1" />
                                Admin
                            </span>
                            )}
                        </div>
                        </div>

                    </div>
                    </div>
                </header>

                {/* Main Content Area */}
                <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
                    
                    {isAdmin ? (
                    <div className="relative z-10 -mt-12">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8 text-center">
                        <h2 className="text-xl font-bold text-slate-800 mb-2 flex items-center justify-center">
                            <ShieldCheckIcon className="w-6 h-6 text-amber-500 mr-2" />
                            Daftar Tunggakan Siswa
                        </h2>
                        <p className="text-slate-500 text-sm">
                            Berikut adalah daftar siswa yang jadwal pengambilan rapornya ditangguhkan. <br className="hidden md:block" />
                            Klik "Tandai Lunas" jika siswa sudah menyelesaikan pembayaran.
                        </p>
                        </div>

                        <div className="max-w-2xl mx-auto space-y-4">
                        {students.filter(s => s.isHold).length > 0 ? (
                            students.filter(s => s.isHold).map(student => (
                            <div key={student.id} className="bg-white border-l-4 border-red-500 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:shadow-md transition-shadow">
                                <div className="flex items-center gap-4 w-full">
                                <div className="bg-red-50 p-3 rounded-full flex-shrink-0">
                                    <AlertCircleIcon className="h-6 w-6 text-red-500" />
                                </div>
                                <div className="flex flex-col text-left">
                                    <span className="text-lg text-slate-800 font-bold">{student.name}</span>
                                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 w-fit mt-1">
                                    Kelas: {student.className}
                                    </span>
                                </div>
                                </div>
                                <button 
                                onClick={() => toggleHoldStatus(student.id)}
                                className="mt-2 sm:mt-0 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors flex-shrink-0 whitespace-nowrap shadow-sm w-full sm:w-auto"
                                >
                                Tandai Lunas
                                </button>
                            </div>
                            ))
                        ) : (
                            <div className="text-center py-12 px-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                            <div className="bg-emerald-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <ShieldCheckIcon className="h-10 w-10 text-emerald-500" />
                            </div>
                            <h3 className="text-lg font-bold text-slate-900 mb-1">Semua Siswa Telah Lunas</h3>
                            <p className="text-slate-500">Tidak ada lagi tunggakan pembayaran. Semua jadwal siswa telah terbuka.</p>
                            </div>
                        )}
                        </div>
                    </div>
                    ) : (
                    <React.Fragment>
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8 relative z-10 -mt-12">
                        <div className="mb-6 text-center">
                            <h2 className="text-xl font-semibold text-slate-800 mb-2">Cari Jadwal Siswa</h2>
                            <p className="text-slate-500 text-sm">
                            Masukkan nama lengkap atau panggilan dan Harap datang pada rentang waktu tersebut sesuai jadwal.
                            </p>
                        </div>

                        <div className="relative max-w-2xl mx-auto">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <SearchIcon className="h-5 w-5 text-slate-400" />
                            </div>
                            <input
                            type="text"
                            className="block w-full pl-11 pr-4 py-4 border-2 border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-0 focus:border-emerald-500 transition-colors duration-200 text-lg shadow-inner"
                            placeholder="Ketik minimal 3 huruf awalan nama..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            />
                            {searchTerm && (
                            <button 
                                onClick={() => setSearchTerm('')}
                                className="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600"
                            >
                                <span className="text-sm font-medium bg-slate-200 px-2 py-1 rounded-md">Clear</span>
                            </button>
                            )}
                        </div>
                        </div>

                        <div className="max-w-2xl mx-auto">
                        {searchTerm.trim() === '' ? (
                            <div className="text-center py-12 px-4">
                            <div className="bg-emerald-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <UserIcon className="h-10 w-10 text-emerald-400" />
                            </div>
                            <h3 className="text-lg font-medium text-slate-900 mb-1"></h3>
                            <p className="text-slate-500">Mulai ketikkan nama pada kolom pencarian di atas.</p>
                            </div>
                        ) : isSearchTooShort ? (
                            <div className="text-center py-12 px-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                            <div className="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                <SearchIcon className="h-8 w-8 text-blue-400" />
                            </div>
                            <h3 className="text-lg font-bold text-slate-900 mb-1">Ketik Lebih Spesifik</h3>
                            <p className="text-slate-500">
                                Mohon ketik <strong>minimal 3 huruf</strong> agar pencarian lebih akurat dan tepat sasaran.
                            </p>
                            </div>
                        ) : filteredStudents.length > 0 ? (
                            <div className="space-y-4">
                            <p className="text-sm text-slate-500 font-medium mb-4 px-1">
                                Ditemukan {filteredStudents.length} siswa dengan kata kunci "{searchTerm}"
                            </p>
                            
                            {filteredStudents.map((student) => (
                                student.isHold ? (
                                <div key={student.id} className="bg-red-50 border border-red-200 rounded-xl p-5 flex flex-col sm:flex-row items-center sm:items-start gap-4 shadow-sm w-full">
                                    <AlertCircleIcon className="h-8 w-8 text-red-600 flex-shrink-0" />
                                    <div className="flex flex-col text-center sm:text-left w-full mt-1 sm:mt-0">
                                    <span className="text-base sm:text-lg text-red-800 font-bold">Informasi Sesi Ditangguhkan</span>
                                    <span className="text-sm text-red-700 font-medium mt-1">
                                        Mohon maaf, jadwal pengambilan rapor tidak dapat ditampilkan. Harap selesaikan kewajiban pembayaran.
                                    </span>
                                    </div>
                                </div>
                                ) : (
                                <div 
                                    key={student.id} 
                                    className="bg-white rounded-xl shadow-sm border-l-4 border-emerald-500 overflow-hidden hover:shadow-md transition-shadow duration-200 p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 group"
                                >
                                    <div className="flex items-start space-x-4">
                                    <div className="p-3 rounded-full transition-colors bg-slate-100 group-hover:bg-emerald-50">
                                        <UserIcon className="h-6 w-6 text-slate-500 group-hover:text-emerald-600" />
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800 leading-tight mb-1">
                                        {student.name}
                                        </h3>
                                        <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700">
                                        Kelas: {student.className}
                                        </span>
                                    </div>
                                    </div>
                                    
                                    <div className="bg-emerald-50 border border-emerald-100 rounded-lg px-4 py-3 flex items-center w-full sm:w-auto mt-2 sm:mt-0 shadow-sm">
                                    <ClockIcon className="h-5 w-5 text-emerald-600 mr-2 flex-shrink-0" />
                                    <div className="flex flex-col text-left">
                                        <span className="text-xs text-emerald-700 font-semibold uppercase tracking-wider">Sesi Pengambilan</span>
                                        <span className="text-emerald-900 font-bold whitespace-nowrap">{student.time}</span>
                                    </div>
                                    </div>
                                </div>
                                )
                            ))}
                            </div>
                        ) : (
                            <div className="text-center py-12 px-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                            <div className="bg-red-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                <SearchIcon className="h-8 w-8 text-red-400" />
                            </div>
                            <h3 className="text-lg font-medium text-slate-900 mb-1">Siswa Tidak Ditemukan</h3>
                            <p className="text-slate-500">
                                Pastikan ejaan nama sudah benar atau coba gunakan nama panggilan.
                            </p>
                            </div>
                        )}
                        </div>
                    </React.Fragment>
                    )}
                </main>

                {/* Footer */}
                <footer className="bg-white border-t border-slate-200 mt-auto">
                    <div className="max-w-4xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-sm text-slate-500">
                    <p className="text-center sm:text-left">© 2026 SMP Malika Boarding School.</p>
                    <button 
                        onClick={handleAdminAccessClick}
                        className={`mt-4 sm:mt-0 flex items-center p-2 transition-colors rounded-full ${isAdmin ? 'text-blue-600 bg-blue-50' : 'text-slate-300 hover:text-blue-600 hover:bg-slate-100'}`}
                        title={isAdmin ? "Tutup Akses Admin" : "Akses Admin"}
                    >
                        <ShieldIcon className="w-5 h-5" />
                    </button>
                    </div>
                </footer>

                {/* Modal Login Admin */}
                {showLoginModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
                        <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 className="text-lg font-bold text-slate-800 flex items-center">
                            <ShieldIcon className="w-5 h-5 text-blue-600 mr-2" />
                            Masuk Mode Admin
                        </h3>
                        <button 
                            onClick={() => setShowLoginModal(false)}
                            className="text-slate-400 hover:text-slate-600 transition-colors"
                        >
                            <XIcon className="w-5 h-5" />
                        </button>
                        </div>
                        <form onSubmit={handleLoginSubmit} className="p-6">
                        <div className="mb-4">
                            <label className="block text-sm font-medium text-slate-700 mb-2">Password Akses</label>
                            <input
                            type="password"
                            className={`w-full px-4 py-3 border ${loginError ? 'border-red-300 focus:ring-red-500' : 'border-slate-300 focus:ring-blue-500'} rounded-xl focus:outline-none focus:ring-2 focus:border-transparent transition-all`}
                            placeholder="Masukkan password..."
                            value={passwordInput}
                            onChange={(e) => {
                                setPasswordInput(e.target.value);
                                setLoginError('');
                            }}
                            autoFocus
                            />
                            {loginError && <p className="text-red-500 text-sm mt-2">{loginError}</p>}
                        </div>
                        <div className="flex justify-end gap-3 mt-6">
                            <button
                            type="button"
                            onClick={() => setShowLoginModal(false)}
                            className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors"
                            >
                            Batal
                            </button>
                            <button
                            type="submit"
                            className="px-4 py-2 bg-blue-600 text-white font-medium hover:bg-blue-700 rounded-lg transition-colors shadow-sm"
                            >
                            Masuk
                            </button>
                        </div>
                        </form>
                    </div>
                    </div>
                )}
                </div>
            );
        }

        // Render App ke dalam div#root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
